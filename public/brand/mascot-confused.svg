<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" width="240" height="280" role="img" aria-label="Confused husky mascot">
  <!-- Original v0 Husky mascot, confused (404 page): tilted head, one folded ear, a question mark. -->
  <g transform="translate(20 0)">
  <g stroke="#121212" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
      <!-- body -->
      <path d="M62 180 C40 196 34 236 36 270 L164 270 C166 236 160 196 138 180 C126 190 74 190 62 180 Z" fill="#121212"/>
      <!-- chest -->
      <path d="M78 186 C84 198 116 198 122 186 C136 206 134 240 126 270 L74 270 C66 240 64 206 78 186 Z" fill="#FFFFFF" stroke="none"/>
      <!-- collar -->
      <path d="M58 182 C70 196 130 196 142 182" fill="none" stroke="#F25C05" stroke-width="11"/>
      <path d="M58 182 C70 196 130 196 142 182" fill="none" stroke="#121212" stroke-width="4" stroke-dasharray="0 1" />
      <!-- feet -->
      <path d="M48 270 C48 258 60 254 70 258 C78 254 90 258 90 270 Z" fill="#FFFFFF"/>
      <path d="M110 270 C110 258 122 254 130 258 C140 254 152 258 152 270 Z" fill="#FFFFFF"/>
    </g>
  <g transform="rotate(-12 100 150)">
    <g stroke="#121212" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
      <!-- left ear folded over -->
      <path d="M44 66 L22 40 L70 36 Z" fill="#121212"/>
      <path d="M48 58 L34 44 L62 42 Z" fill="#F25C05" stroke="none"/>
      <path d="M154 72 C162 54 168 36 164 18 C144 24 124 32 110 44 Z" fill="#121212"/>
      <path d="M148 62 C153 50 156 40 154 30 C142 35 132 41 124 48 Z" fill="#F25C05" stroke="none"/>
      <path d="M40 112 L24 122 L38 132 L22 144 L40 154 Z" fill="#121212"/>
      <path d="M160 112 L176 122 L162 132 L178 144 L160 154 Z" fill="#121212"/>
      <path d="M100 36 C58 36 34 66 34 108 C34 150 62 178 100 178 C138 178 166 150 166 108 C166 66 142 36 100 36 Z" fill="#121212"/>
      <path d="M42 116 C46 96 58 82 70 74 C82 80 92 88 100 96 C108 88 118 80 130 74 C142 82 154 96 158 116 C162 152 136 172 100 172 C64 172 38 152 42 116 Z" fill="#FFFFFF" stroke="none"/>
    </g>
    <path d="M88 134 C88 129 112 129 112 134 C112 142 104 148 100 148 C96 148 88 142 88 134 Z" fill="#121212"/>
    <!-- eyes: one squinting, one wide -->
    <ellipse cx="76" cy="112" rx="11" ry="12" fill="#121212"/>
    <circle cx="80" cy="107" r="4" fill="#FFFFFF"/>
    <path d="M114 112 C118 106 130 106 134 112" fill="none" stroke="#121212" stroke-width="6" stroke-linecap="round"/>
    <!-- wobbly mouth -->
    <path d="M84 158 C90 152 96 162 102 156 C108 150 114 160 120 154" fill="none" stroke="#121212" stroke-width="5" stroke-linecap="round"/>
  </g>
  <!-- question mark sticker -->
  <g transform="translate(166 24) rotate(8)">
    <rect x="-18" y="-18" width="40" height="40" rx="6" fill="#F25C05" stroke="#121212" stroke-width="4"/>
    <text x="2" y="12" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-weight="700" font-size="30" fill="#121212">?</text>
  </g>
  </g>
</svg>
